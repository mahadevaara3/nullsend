name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The mirrored model files are hash-checked, so caching them is safe and saves ~55 MB per run.
      - uses: actions/cache@v4
        with:
          path: public/vendor/imgly
          key: imgly-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /nullsend/
          WEBMCP_TRIAL_TOKEN: ${{ vars.WEBMCP_TRIAL_TOKEN }}
          SITE_URL: https://mahadevaara3.github.io/nullsend/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
